[project]
name = "rcgate"
version = "0.1.0"
description = "Reliability-Conditioned Gated Mixture-of-Experts for hallucination detection (prototype)"
requires-python = ">=3.11"
dependencies = [
    "torch",
    "scikit-learn",
    "pandas",
    "pyarrow",
    "numpy",
    "sentence-transformers",
    "transformers",
    "rank-bm25",
    "pyyaml",
    "matplotlib",
]

[project.optional-dependencies]
demo = ["streamlit"]
dev = ["pytest", "ruff"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["rcgate*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "C4"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
