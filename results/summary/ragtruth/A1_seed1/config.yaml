# resolved config, written by rcgate at run time
baselines:
  a0_class_weight: null
  a1_class_weight: null
  a2_class_weight: null
  a4_learning_rate: 0.08
  a4_max_iter: 300
  a4_max_leaf_nodes: 31
budget:
  dry_run: true
  max_calls: 400
  max_usd: 2.0
data:
  benchmark: ragtruth
  claims_per_source: 6
  dropout_generator_fractions: []
  min_generators: 3
  n_claims: 800
  n_generators: 6
  n_seeds_for_table: 5
  raw_dir: data/raw/ragtruth
  roster:
  - gpt-4-0613
  - gpt-3.5-turbo-0613
  - mistral-7B-instruct
  - llama-2-7b-chat
  - llama-2-13b-chat
  - llama-2-70b-chat
  table: data/signal_tables/ragtruth_s{seed}.parquet
  table_seeds:
  - 0
  - 1
  - 2
  task_types:
  - QA
  - Summary
eval:
  ece_bins: 15
  group_by:
  - claim_type
  - generator_id
  - task_type
  logo: true
  n_bootstrap: 1000
  n_seeds: 3
  threshold_quantile: 0.5
model:
  claim_type_emb_dim: 4
  dropout: 0.0
  fusion_input: logit
  gate_hidden: 16
  gate_temp: 1.0
  generator_emb_dim: 4
  n_generators: 6
  see_signals_in_gate: false
  unk_dropout: 0.1
paths:
  raw_dir: data/raw
  tables_dir: data/signal_tables
pricing:
  bm25: 0.0
  claude-haiku: 0.0008
  gpt-4.1-mini: 0.0004
  gpt-4o-mini: 0.00015
  local-scorer: 0.0
report:
  out_dir: results/summary
  save_checkpoint: true
  save_config: true
  tag: ragtruth
seed: 0
signals:
  arithmetic: true
  backend: cross_encoder
  compute_cache: .cache/compute
  embed_model: sentence-transformers/all-MiniLM-L6-v2
  evidence_aggregate: max
  evidence_top_k: 3
  nli_model: cross-encoder/nli-deberta-v3-small
  premise_top_k: 3
train:
  batch_size: 32
  device: cpu
  epochs: 60
  grad_clip: 1.0
  lr: 0.003
  max_parameters: 50000
  patience: 8
  val_metric: auroc
  weight_decay: 0.0001
