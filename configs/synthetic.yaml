extends: base.yaml

report:
  tag: synthetic

data:
  benchmark: synthetic
  table: "data/signal_tables/synthetic_s{seed}.parquet"
  # 900 questions x 5 generators x 2-4 claims is ~13.5k claims per table, comfortably
  # over the 4,000-claim floor from M1.
  n_questions: 900
  n_generators: 5
  claims_per_answer: 3
  label_noise: 0.05
  table_seeds: [0, 1, 2, 3, 4]
  # Generator 4 is the planted "inverted" family from M1 (see data/synthetic.py).
  inverted_generators: [4]

model:
  n_generators: 5
  gate_hidden: 16
  gate_temp: 1.0
  fusion_input: logit
  unk_dropout: 0.1

train:
  epochs: 80
  batch_size: 128
  lr: 0.003
  patience: 10

eval:
  n_bootstrap: 1000
  n_seeds: 5
  ece_bins: 15
