# Planted ground truth for the SYNTHETIC benchmark (milestone M1).
#
# THIS IS NOT MEASURED DATA. It validates the machinery, not the hypotheses
# (constraint C8). Every table and plot built from it must be labelled "synthetic".
#
# Reading the tables: `faithful` = P(signal is high | claim is true),
# `hallucinated` = P(signal is high | claim is false). A signal is *informative* for a
# claim type when those two numbers differ; it is *anti-informative* when the sign of the
# difference runs opposite to the majority of the table. That is the whole design.

generator_roster:
  - {id: 0, family: standard,  src_quality: 0.85, note: "context-grounded"}
  - {id: 1, family: standard,  src_quality: 0.80, note: "context-grounded"}
  - {id: 2, family: standard,  src_quality: 0.75, note: "context-grounded"}
  - {id: 3, family: small,     src_quality: 0.45, note: "open-web, weaker model"}
  - {id: 4, family: inverted,  src_quality: 0.40, note: "broken decoding: agreement is anti-correlated with truth"}

n_questions: 900
claims_per_answer: 3          # mean; sampled per answer from 2..5
label_noise: 0.05             # labels are a noisy observation of the latent truth
inverted_generators: [4]

# Logit-shifted by a per-question and per-answer random effect, so sibling claims of one
# answer are correlated. This is why the split must be by question_id.
#
# The magnitudes are chosen so within-answer clustering inflates the variance of the
# per-answer hallucination rate by roughly 1.4x over binomial. A random claim-level split
# would then leak materially, which is what tests/test_splits.py asserts.
question_effect_sd: 0.7
answer_effect_sd: 1.1

# P(latent claim is hallucinated) before random effects, per claim type.
base_rate:
  numeric: 0.30
  entity: 0.25
  extractive: 0.35
  abstractive: 0.30

# ---------------------------------------------------------------------------
# Signal reliability, read as: which family can you trust, given the claim type?
#
#   claim type | cross-model family      | evidence family
#   -----------+-------------------------+--------------------------
#   numeric    | ANTI-informative        | STRONG
#   entity     | informative             | weak
#   extractive | informative             | moderate
#   abstractive| informative             | weak
#
# Why numeric is the conflict cell (the planted "correlated LLM errors" slice, reviewer
# attack 5): a numeric error is copied from a shared source table, so every generator
# emits the same wrong number. Cross-model agreement is therefore HIGH either way, and
# cross-model contradiction is LOW exactly when the claim is false -- contra points the
# wrong way. Meanwhile the evidence family is strong, because an arithmetic check can
# actually verify `847 * 12` deterministically. This is what makes the proposal's
# "prioritize computational verification" claim testable, and it is why the gate must
# up-weight evidence on numeric claims.
#
# Why the other three types are the reverse cell: cross-model consensus is informative
# there, while retrieval-plus-NLI over a short context is weak.
#
# This two-way conflict is what makes a *gate* necessary. A flat logistic regression has
# one global coefficient per signal. It must carry cross weight for the other three types
# (75% of claims), and that same weight wrecks the numeric cell. Empirically, if the
# evidence family is strong on every type, a flat model simply ignores the cross family
# and scores 0.91 AUROC on numeric -- see the sweep recorded in DECISIONS.md. The M2
# acceptance criterion is only reachable when the evidence family is weak off-numeric.
#
# sem_dist is deliberately uninformative everywhere. An earlier revision had it
# informative on three types, and a flat regression moved the cross family's weight onto
# it and left contra near zero, hiding the numeric failure entirely. Collinearity between
# cross signals lets a flat model dodge the conflict the gate exists to resolve, so the
# planted cross family carries exactly one informative direction. Costs realism;
# documented here.
# ---------------------------------------------------------------------------
signals:
  agree:
    numeric:     {faithful: 0.80, hallucinated: 0.75}
    entity:      {faithful: 0.88, hallucinated: 0.42}
    extractive:  {faithful: 0.70, hallucinated: 0.62}
    abstractive: {faithful: 0.80, hallucinated: 0.50}
  contra:
    numeric:     {faithful: 0.78, hallucinated: 0.10}
    entity:      {faithful: 0.15, hallucinated: 0.72}
    extractive:  {faithful: 0.25, hallucinated: 0.68}
    abstractive: {faithful: 0.25, hallucinated: 0.62}
  sem_dist:
    numeric:     {faithful: 0.50, hallucinated: 0.51}
    entity:      {faithful: 0.50, hallucinated: 0.51}
    extractive:  {faithful: 0.50, hallucinated: 0.51}
    abstractive: {faithful: 0.50, hallucinated: 0.51}
  support:
    numeric:     {faithful: 0.60, hallucinated: 0.35}
    entity:      {faithful: 0.56, hallucinated: 0.49}
    extractive:  {faithful: 0.60, hallucinated: 0.46}
    abstractive: {faithful: 0.55, hallucinated: 0.47}
  conflict:
    numeric:     {faithful: 0.42, hallucinated: 0.55}
    entity:      {faithful: 0.45, hallucinated: 0.47}
    extractive:  {faithful: 0.42, hallucinated: 0.48}
    abstractive: {faithful: 0.44, hallucinated: 0.46}

# src_quality deliberately has NO entry in the tables above. It is a property of the
# evidence *source*, not of the claim, so it carries no label information by
# construction; a label-conditioned number here would invent precision the heuristic
# does not have. Its mean comes from generator_roster instead.

# For a generator in `inverted_generators`, agree is regenerated from this table instead.
# Agreement then rises with hallucination, so a flat fusion that trusts agreement is
# actively misled, and the gate has a reason to re-weight that generator differently.
inverted_agree:
  numeric:     {faithful: 0.25, hallucinated: 0.75}
  entity:      {faithful: 0.20, hallucinated: 0.80}
  extractive:  {faithful: 0.30, hallucinated: 0.70}
  abstractive: {faithful: 0.25, hallucinated: 0.72}

src_quality:
  jitter_sd: 0.08            # around the generator's roster value
  floor: 0.05
  ceiling: 1.0
